---
schema_version: "0.3"
id: BW-2026-0015
status: draft
published: "2026-10-31"
package:
  ecosystem: PyPI
  name: pydantic-ai
  aliases:
    - pydantic-ai-slim
type: behavior
breaks_in: "2.0.0b1"
works_since: "1.3.0"
summary: The model prefix openai uses the Responses API from 2.0.0b1, and openai-chat keeps Chat Completions.
instructions: >-
  A model name that starts with openai: now makes an OpenAIResponsesModel, not an OpenAIChatModel.
  To keep Chat Completions, as in 1.x, write openai-chat: in place of openai:, as in openai-chat:gpt-5.
  To move to the Responses API, keep openai:, which now means the same as openai-responses:,
  and check the code that depends on the model class or on Chat Completions settings.
affects:
  - path: pydantic_ai.Agent
    keyword: model
example:
  before: |
    from pydantic_ai import Agent
    from pydantic_ai.models.openai import OpenAIChatModel

    agent = Agent(model="openai:gpt-5")
    assert isinstance(agent.model, OpenAIChatModel)
  after: |
    from pydantic_ai import Agent
    from pydantic_ai.models.openai import OpenAIChatModel

    agent = Agent(model="openai-chat:gpt-5")
    assert isinstance(agent.model, OpenAIChatModel)
  fails_with:
    before:
      error: AssertionError
    after:
      error: ValueError
      message: 'Unknown provider: openai-chat'
references:
  - https://pydantic.dev/docs/ai/project/changelog/
  - https://github.com/pydantic/pydantic-ai/blob/v2.0.0b1/pydantic_ai_slim/pydantic_ai/models/__init__.py
