rename:
  keyword_of:
    - pydantic_ai.Agent
  from: mcp_servers
  to: toolsets
example:
  before: |
    from pydantic_ai import Agent

    agent = Agent("test", mcp_servers=[])
  after: |
    from pydantic_ai import Agent

    agent = Agent("test", toolsets=[])
