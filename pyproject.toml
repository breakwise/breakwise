[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breakwise"
dynamic = ["version"]
description = "Tested notices of breaking changes in Python libraries, and the tools that apply them."
readme = "docs/pypi.md"
requires-python = ">=3.12"
# The code is Apache-2.0, and the notices that come with it are CC BY 4.0.
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "notices/LICENSE.md"]
dependencies = ["pyyaml>=6.0.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/breakwise/breakwise"
Documentation = "https://github.com/breakwise/breakwise/tree/main/docs"
Issues = "https://github.com/breakwise/breakwise/issues"

[project.scripts]
breakwise = "breakwise.cli:main"

[tool.hatch.version]
path = "src/breakwise/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["src", "notices", "docs/pypi.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/breakwise"]

# The notices go into the package, next to where the index will go later.
[tool.hatch.build.targets.wheel.force-include]
"notices" = "breakwise/data/notices"

# Settings for the development tools.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["tools", "src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "tools,src"
files = ["tools", "src", "tests"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",    # shadowed builtins
    "ARG",  # unused arguments
    "B",    # likely bugs
    "BLE",  # blind except
    "C4",   # comprehensions
    "C90",  # complexity
    "DTZ",  # dates without time zones
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "FURB", # modern idioms
    "I",    # import order
    "ISC",  # implicit string concatenation
    "N",    # naming
    "PERF", # performance
    "PGH",  # blanket noqa and type: ignore
    "PIE",
    "PL",   # pylint
    "PT",   # pytest style
    "PTH",  # pathlib
    "RET",  # return statements
    "RUF",  # ruff
    "S",    # security
    "SIM",  # simplifications
    "SLF",  # private access
    "TRY",  # exception handling
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
# Messages are written where the error is raised, which keeps them readable.
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG",     # fakes take the arguments of what they replace
    "PLR0913", # parametrized tests take many arguments
    "PLR0917", # and take them by position
    "PLR2004", # expected values are written inline
    "S101",    # pytest uses assert
    "S603",    # tests run subprocesses with fixed arguments
    "S607",    # and find git on PATH
    "SLF001",  # tests may call private helpers
]

[tool.ruff.lint.isort]
known-first-party = ["breakwise", "validate_notices", "verify_examples"]
