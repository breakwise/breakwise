---
name: checks

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every Monday, so that changes on PyPI, such as yanked releases, are noticed.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate notices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
      - name: Check types
        run: mypy
      - name: Test the tools, with full branch coverage
        run: python -m pytest --cov
      - name: Validate notices
        run: python tools/validate_notices.py
      - name: Lint YAML
        run: yamllint --strict .
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: Lint workflows
        env:
          # actionlint is not on PyPI as a wheel, so its release is downloaded and checked.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          release="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "$release/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          zizmor --offline .github/workflows

  examples:
    name: Verify examples
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # For a pull request, its own last commit rather than a merge with the base branch,
          # so that the files it changed are found even after the base branch moves on.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify examples on real package versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python tools/verify_examples.py --changed-since "$BASE_SHA"
          else
            python tools/verify_examples.py --all
          fi
