---
name: checks

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every Monday, so that changes on PyPI, such as yanked releases, are noticed.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # release.yml runs these checks on the tagged commit before it builds.
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a run that another workflow calls, github.workflow is the caller's name, so the run
  # never shares a group with, or cancels, the checks of the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate notices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          # No cache: a cache that pull requests can write could be poisoned.
          package-manager-cache: false
      - name: Install tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint Python
        run: |
          ruff check .
          ruff format --check .
      - name: Check types
        run: mypy
      - name: Test the tools, with full branch coverage
        run: python -m pytest --cov
      - name: Validate notices
        run: python tools/validate_notices.py
      - name: Build the package and run it
        # The wheel must hold the notices and both licenses, and the command must work from it.
        # release.yml repeats these checks on the files it publishes.
        run: |
          python -m build --no-isolation --outdir "$RUNNER_TEMP/dist"
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          python -m zipfile -l "${wheels[0]}" > "$RUNNER_TEMP/wheel.txt"
          for file in \
            breakwise/data/notices/pypi/pydantic-ai/BW-2026-0001.yaml \
            licenses/LICENSE \
            licenses/notices/LICENSE.md; do
            grep -F "$file" "$RUNNER_TEMP/wheel.txt"
          done
          python -m pip install --no-deps "${wheels[0]}"
          breakwise explain BW-2026-0001
      - name: Lint YAML
        run: yamllint --strict .
      - name: Lint Markdown
        run: npx --no-install markdownlint-cli2 "**/*.md"
      - name: Lint workflows
        env:
          # actionlint is not on PyPI as a wheel, so its release is downloaded and checked.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          release="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "$release/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
          zizmor --offline .github/workflows .github/dependabot.yml

  # The tools also run on newer Python. Examples stay on 3.12, because old
  # releases of a package may not install on newer Python.
  newer-python:
    name: Test tools (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Test the tools, with full branch coverage
        run: python -m pytest --cov
      - name: Validate notices
        run: python tools/validate_notices.py

  # The package runs on its users' systems, so it is tested on Windows and macOS too, with
  # their own settings: no PYTHONIOENCODING or PYTHONUTF8.
  other-systems:
    name: Test on ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            runner: windows-2025
          - system: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Test the tools and the package
        # Without --cov: Windows skips the tests of the verifier, so only the Linux jobs
        # require full coverage.
        run: python -m pytest
      - name: Validate notices
        run: python tools/validate_notices.py
      - name: Build the package and install it
        shell: bash
        run: |
          python -m build --no-isolation --outdir dist
          wheels=(dist/*.whl)
          python -m pip install --no-deps "${wheels[0]}"
      - name: Write a notice to a file, as a user would
        # In the default shell: PowerShell on Windows, bash on macOS.
        run: breakwise explain BW-2026-0001 > explain.txt
      - name: Check that the file is UTF-8
        shell: python
        run: |
          import pathlib, shutil, subprocess, sys
          from breakwise.cli import render
          from breakwise.notices import find

          def read_utf8(name):
              data = pathlib.Path(name).read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  sys.exit(f"{name} starts with a byte order mark.")
              try:
                  return data.decode("utf-8").replace("\r\n", "\n")
              except UnicodeDecodeError as error:
                  sys.exit(f"{name} is not UTF-8: {error}")

          if read_utf8("explain.txt") != render(find("BW-2026-0001")) + "\n":
              sys.exit("explain.txt does not hold the whole notice.")
          # The notices are ASCII, so an arrow, which cp1252 lacks, comes through an error
          # message, written to a file as with 2> error.txt.
          with open("error.txt", "wb") as error:
              subprocess.run([shutil.which("breakwise"), "explain", "BW-\u2192"], stderr=error)
          expected = "breakwise: 'BW-\u2192' is not a notice ID. IDs look like BW-2026-0001.\n"
          if read_utf8("error.txt") != expected:
              sys.exit(f"error.txt holds {read_utf8('error.txt')!r}, not {expected!r}.")

  examples:
    name: Verify examples
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # For a pull request, its own last commit rather than a merge with the base branch,
          # so that the files it changed are found even after the base branch moves on.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify examples on real package versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python tools/verify_examples.py --changed-since "$BASE_SHA"
          else
            python tools/verify_examples.py --all
          fi
