---
name: release

"on":
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # First, so that a wrong tag fails in seconds, before the tests and examples of its commit run.
  tag:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history, so that the tag's commit can be looked up on main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to $GITHUB_SHA, which is not on main. Tag a commit of main."
            exit 1
          fi
          version=$(PYTHONPATH=src python -c "import breakwise; print(breakwise.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match version $version in src/breakwise/__init__.py. Tag v$version."
            exit 1
          fi

  # Every check of a pull request, on the tagged commit. The event is a push, so the examples
  # of every notice run.
  checks:
    needs: tag
    # With ./, checks.yml comes from the tagged commit too. zizmor asks for $/ instead, which
    # actionlint 1.7.12 rejects.
    uses: ./.github/workflows/checks.yml  # zizmor: ignore[self-repository]
    # What checks.yml asks for: a called workflow gets no more than the job that calls it.
    permissions:
      contents: read

  build:
    name: Build the release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate notices
        run: python tools/validate_notices.py
      - name: Build the package and run it
        # The same checks as in checks.yml, on the files that are published.
        run: |
          python -m build --no-isolation --outdir dist
          wheels=(dist/*.whl)
          python -m zipfile -l "${wheels[0]}" > "$RUNNER_TEMP/wheel.txt"
          for file in \
            breakwise/data/notices/pypi/pydantic-ai/BW-2026-0001.yaml \
            licenses/LICENSE \
            licenses/notices/LICENSE.md; do
            grep -F "$file" "$RUNNER_TEMP/wheel.txt"
          done
          python -m pip install --no-deps "${wheels[0]}"
          breakwise explain BW-2026-0001
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/breakwise/
    permissions:
      id-token: write  # Trusted Publishing: PyPI trusts this workflow's identity, so no token is stored.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
